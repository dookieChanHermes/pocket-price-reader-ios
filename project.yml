name: PocketPriceReader
options:
  bundleIdPrefix: com.pocketpricereader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ja, zh-Hans, zh-Hant]

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: KRV2243NRM
    CODE_SIGN_STYLE: Automatic

targets:
  PocketPriceReader:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Petal
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Petal reads price tags through the camera and converts them on the
          spot. Nothing is saved or sent anywhere. Type mode works without it.
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketpricereader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  PocketPriceReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PocketPriceReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketpricereader.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PocketPriceReader:
    build:
      targets:
        PocketPriceReader: all
        PocketPriceReaderTests: [test]
    test:
      targets:
        - PocketPriceReaderTests
