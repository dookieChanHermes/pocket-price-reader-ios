name: PocketPriceReader
options:
  bundleIdPrefix: com.pocketpricereader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"

targets:
  PocketPriceReader:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Price Reader
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Pocket Price Reader uses the camera to read foreign price tags and
          convert them to your home currency. Conversion also works offline in
          Type mode.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketpricereader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PocketPriceReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PocketPriceReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketpricereader.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PocketPriceReader:
    build:
      targets:
        PocketPriceReader: all
        PocketPriceReaderTests: [test]
    test:
      targets:
        - PocketPriceReaderTests
